# Оркестрация: ML-сервис за reverse proxy NGINX
# Запуск:   docker compose up --build -d
# Проверка: curl http://localhost/health          (через NGINX, порт 80)
#           curl http://localhost:5000/health     (напрямую в сервис)
# Остановка: docker compose down

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: credit-default-api:1.0
    container_name: credit-api
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
      # Доля трафика на тестовую модель v2 в A/B-тесте
      AB_TRAFFIC_SPLIT: "0.5"
      MAX_BATCH_SIZE: "1000"
    ports:
      # Прямой доступ к сервису оставлен для отладки и демонстрации
      # В реальном production этот порт наружу не публикуют, только через NGINX
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ml_net
    logging:
      # Ротация логов на стороне Docker: без неё JSON-логи растут без ограничений
      # В production вместо json-file ставят драйвер сборщика (gelf, fluentd)
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: credit-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ml_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ml_net:
    driver: bridge
