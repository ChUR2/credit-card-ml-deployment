# Конфигурация NGINX как reverse proxy перед gunicorn.
#
# Зачем NGINX перед приложением в production:
#   1. Терминация TLS — сертификаты живут здесь, а не в Python-коде.
#   2. Балансировка на несколько инстансов сервиса (upstream).
#   3. Отсечение медленных клиентов и защита от slowloris — gunicorn
#      не тратит воркеры на ожидание тела запроса.
#   4. Rate limiting и отдача статики.
#   5. Единая точка сбора access-логов в общем формате.

events {
    worker_connections 1024;
}

http {
    # Логи в stdout контейнера — их забирает Docker и передаёт в ELK
    log_format json_combined escape=json
        '{"ts":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$request_uri","status":$status,'
        '"upstream_time":"$upstream_response_time","bytes":$body_bytes_sent,'
        '"request_id":"$http_x_request_id"}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # Ограничение частоты запросов: 20 rps на IP с всплеском до 40
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream ml_api {
        # Имя сервиса из docker-compose.yml резолвится встроенным DNS Docker
        server api:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;

        location / {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://ml_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # Health-check не логируем, чтобы не засорять access-лог
        location /health {
            access_log off;
            proxy_pass http://ml_api/health;
        }
    }
}
